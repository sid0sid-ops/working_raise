[project]
name = "raise-html5-semantification"
version = "0.1.0"
description = "Clean HTML5 semantification for prepared RAISE annual-report block JSON."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.22.0",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "nbformat>=5.10.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
raise-html5-semantification = "raise_html5_semantification.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raise_html5_semantification"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
