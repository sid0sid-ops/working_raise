<!-- Workspace Header Component -->
<header class="page-header" id="pageHeader">
    <div class="header-container">
        <div class="title-container">
            <button type="button" class="back-home-btn" onclick="AppRouter.showHome()" title="Back to Research Hub">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <input 
                type="text" 
                class="project-title-input" 
                id="projectTitleInput" 
                value="Academic Reports Vault" 
                spellcheck="false" 
                aria-label="Notebook Title"
                oninput="HeaderModule.handleTitleChange(this.value)"
            />
            <span class="offline-badge-mini" title="Offline-ready: All models & indices execute on localhost.">
                <span class="status-dot"></span> Local
            </span>
        </div>

        <!-- Mobile Responsive Tabs -->
        <div class="mobile-tab-bar" id="mobileTabBar">
            <button type="button" class="mobile-tab active" id="tab-sources" onclick="TabModule.switchTab('sources')">Sources</button>
            <button type="button" class="mobile-tab" id="tab-chat" onclick="TabModule.switchTab('chat')">Chat</button>
            <button type="button" class="mobile-tab" id="tab-studio" onclick="TabModule.switchTab('studio')">Graph Studio</button>
        </div>

        <div class="header-actions">
            <button type="button" class="header-action-btn" onclick="SourcesModule.loadDocuments()" title="Refresh Sources">
                <span class="material-symbols-outlined">refresh</span>
            </button>
            <button type="button" class="header-action-btn" onclick="clearConversation()" title="Clear Conversation">
                <span class="material-symbols-outlined">delete</span>
            </button>
            <button type="button" class="header-action-btn" onclick="SettingsModal.open()" title="Settings">
                <span class="material-symbols-outlined">tune</span>
            </button>
        </div>
    </div>
</header>
