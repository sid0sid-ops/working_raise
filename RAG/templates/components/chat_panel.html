<!-- Chat Panel Component -->
<main class="panel-card chat-panel active-panel" id="chatViewport">
    <div class="panel-card-header">
        <div class="panel-header-left">
            <span class="panel-header-title">Academic Q&A & Evidence Synthesis</span>
        </div>
        <div class="panel-header-actions">
            <button type="button" class="panel-icon-btn" title="Grounded Evidence Drawer" onclick="EvidenceDrawer.toggle()">
                <span class="material-symbols-outlined">menu_book</span>
            </button>
        </div>
    </div>

    <div class="chat-panel-body" id="chatPanelBody">
        <div class="chat-messages-container" id="chatMessages">
            <!-- Populated dynamically by ChatModule -->
        </div>
    </div>

    <div class="chat-omnibar-wrapper">
        <form class="omnibar-form" id="queryForm" onsubmit="handleQuerySubmit(event)">
            <textarea 
                id="queryInput" 
                rows="1" 
                class="omnibar-textarea" 
                placeholder="Ask a question across your indexed academic literature..." 
                dir="auto" 
                autocomplete="off"
                onkeydown="handleKeyDown(event)"
                oninput="handleInputChange(this)"
                required
            ></textarea>
            
            <div class="omnibar-controls">
                <div class="omnibar-left-controls">
                    <button type="button" class="composer-icon-btn" id="voiceInputBtn" title="Voice Input" onclick="VoiceModule.toggleInput()">
                        <span class="material-symbols-outlined icon-xs">mic</span>
                    </button>
                    <div class="omnibar-source-tag" id="selectedSourcesCount">0 documents active</div>
                </div>
                <button type="submit" id="sendBtn" class="omnibar-submit-btn" title="Ask Research (Enter)">
                    <span class="material-symbols-outlined" id="sendBtnIcon">north_east</span>
                </button>
            </div>
        </form>
    </div>
</main>
