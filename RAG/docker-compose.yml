# ==============================================================================
# RAISE Academic GraphRAG Studio — Canonical Docker Compose Orchestration
# Location: RAG/docker-compose.yml
# Workflow:
#   cd RAG
#   docker compose up --build -d
# Services:
#   1. neo4j: Enterprise Property Graph Database with APOC
#   2. ollama: Local Offline LLM Inference Engine (Qwen 2.5 / Llama 3.1)
#   3. raise-app: FastAPI + LangGraph StateGraph Academic Retrieval Studio
# ==============================================================================

name: raise
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Neo4j Property Knowledge Graph Service
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26-community
    container_name: raise-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # Neo4j Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Cypher Bolt Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL_SIZE:-512m}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX_SIZE:-2G}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE_SIZE:-1G}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password123} 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - raise-network

  # ----------------------------------------------------------------------------
  # 2. Ollama Local LLM Inference Engine
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: raise-ollama
    restart: unless-stopped
    ports:
      - "11434:11434" # Ollama HTTP REST API
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - raise-network

  # ----------------------------------------------------------------------------
  # 3. RAISE FastAPI + LangGraph Academic Studio Application
  # ----------------------------------------------------------------------------
  raise-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raise-graphrag-studio
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-qwen2.5:7b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    volumes:
      - ./data/documents:/app/data/documents:ro
      - ./data/processed:/app/data/processed
      - ./.runtime:/app/.runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/documents/manifest"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - raise-network

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  ollama_models:
    driver: local

networks:
  raise-network:
    driver: bridge
