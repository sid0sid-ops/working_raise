[package]
name = "raise_engine"
version = "0.1.0"
edition = "2021"
authors = ["RAISE Engineering Team"]
description = "High-performance acceleration engine for Graph-Guided Adaptive Hierarchical Chunking (GGAHC), BM25, and graph analytics"

[lib]
name = "raise_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "raise-cli"
path = "src/bin/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
sha2 = "0.10"
pyo3 = { version = "0.22", optional = true }

[features]
default = ["python"]
python = ["dep:pyo3", "pyo3/extension-module", "pyo3/abi3-py39"]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
