# ==============================================================================
# RAISE Academic GraphRAG Studio — Unified Production Docker Compose Stack
# Services:
#   1. postgres: PostgreSQL 16 (persistent chat sessions, messages, feedback, document metadata)
#   2. redis: Redis 7 In-Memory Cache (sub-millisecond query cache & token rate limiter)
#   3. neo4j: Neo4j 5.26 Community (property graph knowledge base with APOC)
#   4. vllm: vLLM Qwen 2.5 14B GPTQ Int4 (GPU-accelerated local inference)
#   5. backend: FastAPI + LangGraph Agentic Pipeline (retrieval, reasoning, streaming SSE)
#   6. cloudflared: Cloudflare Tunnel Container (encrypted inbound tunnel to backend)
# ==============================================================================

name: raise-production

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Relational & Metadata Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: raise-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-raise_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-raise_password}
      - POSTGRES_DB=${POSTGRES_DB:-raise_db}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - raise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raise_user} -d ${POSTGRES_DB:-raise_db} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - raise-network

  # ----------------------------------------------------------------------------
  # 2. Redis Fast Response & Rate Limiting Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: raise-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - raise_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - raise-network

  # ----------------------------------------------------------------------------
  # 3. Neo4j Property Knowledge Graph Service
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26-community
    container_name: raise-neo4j-prod
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL_SIZE:-8G}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX_SIZE:-12G}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE_SIZE:-16G}
    volumes:
      - neo4j_prod_data:/data
      - neo4j_prod_logs:/logs
      - neo4j_prod_import:/var/lib/neo4j/import
      - neo4j_prod_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password123} 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - raise-network

  # ----------------------------------------------------------------------------
  # 4. vLLM High-Throughput Inference Engine (Qwen 2.5 14B GPTQ Int4)
  # ----------------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:v0.6.6.post1
    container_name: raise-vllm-prod
    restart: unless-stopped
    command: >
      --model Qwen/Qwen2.5-14B-Instruct-GPTQ-Int4
      --host 0.0.0.0
      --port 8000
      --quantization gptq
      --max-model-len 8192
      --gpu-memory-utilization 0.55
      --enable-prefix-caching
      --trust-remote-code
      --tensor-parallel-size 1
    ports:
      - "8002:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_V1=0
    ipc: host
    volumes:
      - ${HOME:-.}/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - raise-network

  # ----------------------------------------------------------------------------
  # 5. RAISE FastAPI Backend & Orchestrator
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raise-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      vllm:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - RUST_BACKTRACE=1
      - PYTHONPATH=/app:/app/bin
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-raise_db}
      - POSTGRES_USER=${POSTGRES_USER:-raise_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-raise_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - VLLM_BASE_URL=http://vllm:8000/v1
      - OPENAI_BASE_URL=http://vllm:8000/v1
      - LLM_BACKEND=openai-compatible
      - LLM_MODEL_NAME=Qwen/Qwen2.5-14B-Instruct-GPTQ-Int4
      - CHROMA_PERSIST_DIRECTORY=/app/.chromadb_bge_large
      - CHROMA_COLLECTION_NAME=iitmrp_docling_bge_large
      - EMBEDDING_MODEL=BAAI/bge-large-en-v1.5
      - EMBEDDING_DEVICE=cpu
      - EMBEDDING_DIMENSION=1024
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-7e0d71f40bfbde222165bd902d52c2ff}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-cfat_0RmUPD97ahAKxLICkwdmXiMvV4Xwpkk1fj1KMSL5f1c34655}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID:-f8d0e3ba973c48a5bbb609899bb5ec63}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-b7fcb38227c0c7ee12fc6fcd8ce244ed9d21e651d4fd0f5e2adaf821a65e4694}
      - CLOUDFLARE_R2_ENDPOINT_URL=${CLOUDFLARE_R2_ENDPOINT_URL:-https://7e0d71f40bfbde222165bd902d52c2ff.r2.cloudflarestorage.com}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME:-raise-documents}
    volumes:
      - ./data/documents:/app/data/documents
      - ./data/processed:/app/data/processed
      - ./.chromadb_bge_large:/app/.chromadb_bge_large
      - ./.runtime:/app/.runtime
      - ${HOME:-.}/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - raise-network

  # ----------------------------------------------------------------------------
  # 6. Cloudflare Tunnel Container (Secure Ingress)
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: raise-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - raise-network

volumes:
  raise_postgres_data:
  raise_redis_data:
  neo4j_prod_data:
  neo4j_prod_logs:
  neo4j_prod_import:
  neo4j_prod_plugins:

networks:
  raise-network:
    name: raise-network
    driver: bridge
